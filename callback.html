<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020711">
  <title>IDP GMS 로그인 처리 · v7.1.3</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020711;color:#eaf6ff;font-family:Arial,sans-serif}
    .box{width:min(520px,90vw);padding:30px;border:1px solid #2d5366;border-radius:16px;background:#08131f;text-align:center;box-shadow:0 20px 60px #0007}
    h1{font-size:22px;margin:0 0 10px}.sub{color:#93afc0;font-size:14px;line-height:1.65}.gold{color:#f2c85b}
  </style>
</head>
<body>
  <div class="box">
    <h1>IDP · GMS 로그인 처리 중</h1>
    <div class="sub" id="msg">Google 인증 결과를 확인하고 있습니다.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script>
  (async function(){
    const HOME='https://jeonseongkweon-cloud.github.io/idp-simulator/';
    const msg=document.getElementById('msg');

    function getCfg(){
      const c=window.IDP_CONFIG||window.CONFIG||window.SUPABASE_CONFIG||{};
      return {
        url:c.supabaseUrl||c.SUPABASE_URL||window.SUPABASE_URL||'',
        key:c.supabaseKey||c.supabaseAnonKey||c.SUPABASE_KEY||c.SUPABASE_ANON_KEY||
            window.SUPABASE_KEY||window.SUPABASE_ANON_KEY||''
      };
    }

    const cfg=getCfg();
    if(!window.supabase||!cfg.url||!cfg.key){
      msg.innerHTML='<span class="gold">Supabase 설정을 읽지 못했습니다.</span>';
      setTimeout(()=>location.replace(HOME),1800);
      return;
    }

    const client=window.supabase.createClient(cfg.url,cfg.key,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:'implicit'
      }
    });

    try{
      const u=new URL(location.href);
      const qError=u.searchParams.get('error');
      const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));
      const hError=hash.get('error');
      const err=qError||hError;

      if(err){
        const desc=u.searchParams.get('error_description')||hash.get('error_description')||err;
        msg.innerHTML='<span class="gold">Google 로그인 오류:</span><br>'+decodeURIComponent(desc);
        setTimeout(()=>location.replace(HOME),2400);
        return;
      }

      // In implicit flow Supabase JS reads access_token/refresh_token from URL hash.
      // Give it a short moment to persist the session.
      await new Promise(r=>setTimeout(r,350));
      const {data:{session},error}=await client.auth.getSession();
      if(error) throw error;

      if(session?.user){
        msg.innerHTML='✅ GMS 로그인 완료<br><span class="gold">'+session.user.email+'</span><br>시뮬레이터로 돌아갑니다.';
        setTimeout(()=>location.replace(HOME),900);
      }else{
        msg.innerHTML='<span class="gold">로그인 토큰을 확인하지 못했습니다.</span><br>다시 시도해주세요.';
        setTimeout(()=>location.replace(HOME),2200);
      }
    }catch(e){
      console.error('[IDP CALLBACK]',e);
      msg.innerHTML='<span class="gold">로그인 처리 실패:</span><br>'+(e?.message||String(e));
      setTimeout(()=>location.replace(HOME),2600);
    }
  })();
  </script>
</body>
</html>
