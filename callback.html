<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020711">
  <title>IDP GMS 로그인 처리</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020711;color:#eaf6ff;font-family:Arial,sans-serif}
    .box{width:min(520px,90vw);padding:28px;border:1px solid #2d5366;border-radius:16px;background:#08131f;text-align:center}
    h1{font-size:22px;margin:0 0 10px}.sub{color:#93afc0;font-size:14px;line-height:1.6}.gold{color:#f2c85b}
  </style>
</head>
<body>
  <div class="box">
    <h1>IDP · GMS 로그인 처리 중</h1>
    <div class="sub" id="msg">Google 인증 결과를 확인하고 시뮬레이터로 돌아갑니다.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script>
  (async function(){
    const HOME='https://jeonseongkweon-cloud.github.io/idp-simulator/';
    const msg=document.getElementById('msg');

    function getCfg(){
      const c=window.IDP_CONFIG||window.CONFIG||window.SUPABASE_CONFIG||{};
      return {
        url:c.supabaseUrl||c.SUPABASE_URL||window.SUPABASE_URL||'',
        key:c.supabaseKey||c.supabaseAnonKey||c.SUPABASE_KEY||c.SUPABASE_ANON_KEY||window.SUPABASE_KEY||window.SUPABASE_ANON_KEY||''
      };
    }

    const {url,key}=getCfg();

    if(!window.supabase){
      msg.innerHTML='<span class="gold">Supabase SDK를 불러오지 못했습니다.</span>';
      setTimeout(()=>location.replace(HOME),1800);
      return;
    }

    if(!url||!key){
      msg.innerHTML='<span class="gold">Supabase 설정을 찾지 못했습니다.</span>';
      console.warn('[IDP CALLBACK] config missing',{url:!!url,key:!!key,config:window.IDP_CONFIG});
      setTimeout(()=>location.replace(HOME),1800);
      return;
    }

    const client=window.supabase.createClient(url,key,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:'pkce'
      }
    });

    try{
      const current=new URL(location.href);
      const error=current.searchParams.get('error');
      const errorDescription=current.searchParams.get('error_description');
      const code=current.searchParams.get('code');

      if(error){
        msg.innerHTML='<span class="gold">Google 로그인 오류:</span> '+(errorDescription||error);
        setTimeout(()=>location.replace(HOME),2200);
        return;
      }

      if(code){
        const {error:exchangeError}=await client.auth.exchangeCodeForSession(code);
        if(exchangeError) throw exchangeError;
      }

      const {data:{session},error:sessionError}=await client.auth.getSession();
      if(sessionError) throw sessionError;

      if(session?.user){
        msg.innerHTML='✅ GMS 로그인 완료<br><span class="gold">'+session.user.email+'</span><br>시뮬레이터로 돌아갑니다.';
        setTimeout(()=>location.replace(HOME),900);
      }else{
        msg.innerHTML='<span class="gold">로그인 세션을 확인하지 못했습니다.</span><br>시뮬레이터로 돌아갑니다.';
        setTimeout(()=>location.replace(HOME),1800);
      }
    }catch(err){
      console.error('[IDP CALLBACK]',err);
      msg.innerHTML='<span class="gold">로그인 처리 실패:</span><br>'+(err?.message||String(err));
      setTimeout(()=>location.replace(HOME),2600);
    }
  })();
  </script>
</body>
</html>
